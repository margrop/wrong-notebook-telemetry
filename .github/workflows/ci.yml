name: 服务端检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run ci
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: 安装固定版本密钥扫描器
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: 扫描完整提交历史
        # 包含根提交，避免首次推送时构造不存在的父提交范围。
        run: gitleaks git --redact --no-banner --log-opts=--all .
